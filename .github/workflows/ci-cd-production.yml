name: CI/CD Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, ctype, fileinfo, intl, json, openssl, pdo_mysql, tokenizer, xml
          tools: composer:v2
          coverage: none

      - name: Validate composer
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Laravel sanity check
        run: php artisan --version

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    env:
      DEPLOY_HOST: etamu-kcd.smkn1ciamis.id
      DEPLOY_PORT: ${{ secrets.PROD_SSH_PORT || secrets.DEPLOY_PORT || vars.PROD_SSH_PORT || vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.PROD_SSH_USER || secrets.DEPLOY_USER || vars.PROD_SSH_USER || vars.DEPLOY_USER }}
      DEPLOY_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY || secrets.DEPLOY_PRIVATE_KEY }}
      DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH || secrets.DEPLOY_PATH || vars.PROD_DEPLOY_PATH || vars.DEPLOY_PATH }}
      APP_URL: ${{ vars.APP_URL || vars.PROD_APP_URL || 'https://etamu-kcd.smkn1ciamis.id' }}
      DB_HOST: ${{ secrets.PROD_DB_HOST || vars.PROD_DB_HOST || vars.DB_HOST }}
      DB_PORT: ${{ secrets.PROD_DB_PORT || vars.PROD_DB_PORT || vars.DB_PORT }}
      DB_DATABASE: ${{ secrets.PROD_DB_DATABASE || vars.PROD_DB_DATABASE || vars.DB_DATABASE }}
      DB_USERNAME: ${{ secrets.PROD_DB_USERNAME || vars.PROD_DB_USERNAME || vars.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD || secrets.DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build deployable assets
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          npm run build

      - name: Preflight required secrets
        run: |
          set -euo pipefail
          required=(DEPLOY_PORT DEPLOY_USER DEPLOY_PRIVATE_KEY DEPLOY_PATH)
          optional_db=(DB_HOST DB_PORT DB_DATABASE DB_USERNAME DB_PASSWORD)
          missing=()
          missing_optional=()

          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              missing+=("${key}")
            fi
          done

          for key in "${optional_db[@]}"; do
            if [ -z "${!key:-}" ]; then
              missing_optional+=("${key}")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Missing required deployment secrets::${missing[*]}"
            echo "Context: event=${GITHUB_EVENT_NAME}, actor=${GITHUB_ACTOR}, ref=${GITHUB_REF}"
            echo "Hint: isi salah satu nama yang didukung:"
            echo "  DEPLOY_PORT <- PROD_SSH_PORT / DEPLOY_PORT (secret atau variable)"
            echo "  DEPLOY_USER <- PROD_SSH_USER / DEPLOY_USER (secret atau variable)"
            echo "  DEPLOY_PRIVATE_KEY <- PROD_SSH_PRIVATE_KEY / DEPLOY_PRIVATE_KEY (secret)"
            echo "  DEPLOY_PATH <- PROD_DEPLOY_PATH / DEPLOY_PATH (secret atau variable)"
            echo "Hint: simpan di Repository Settings > Secrets and variables > Actions."
            echo "Hint: jika menggunakan Environment secrets, job deploy harus memakai 'environment: <name>'."
            exit 1
          fi

          if [ ${#missing_optional[@]} -gt 0 ]; then
            echo "::warning title=Optional DB secrets not set::${missing_optional[*]}"
            echo "Deploy akan lanjut dan nilai DB pada .env server tidak akan diubah."
          fi

      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Configure SSH private key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          KEY_MATERIAL="${DEPLOY_PRIVATE_KEY//$'\r'/}"
          if [[ "${KEY_MATERIAL}" != *"BEGIN "*" PRIVATE KEY"* ]]; then
            if printf '%s' "${KEY_MATERIAL}" | base64 -d > ~/.ssh/id_ed25519 2>/tmp/ssh-key-decode.err; then
              chmod 600 ~/.ssh/id_ed25519
            else
              echo "::error title=Invalid SSH private key::Secret bukan format key langsung dan gagal decode Base64."
              echo "Hint: isi secret dengan PRIVATE key utuh (BEGIN..END) atau Base64 dari file private key."
              exit 1
            fi
          else
            # Support secrets pasted as literal "\\n" lines or as normal multiline text.
            if [[ "${KEY_MATERIAL}" == *"\\n"* ]]; then
              printf '%b' "${KEY_MATERIAL}" > ~/.ssh/id_ed25519
            else
              printf '%s\n' "${KEY_MATERIAL}" > ~/.ssh/id_ed25519
            fi

            chmod 600 ~/.ssh/id_ed25519
          fi

          if head -n 1 ~/.ssh/id_ed25519 | grep -Eq '^(ssh-rsa|ssh-ed25519|ecdsa-sha2-nistp[0-9]+) '; then
            echo "::error title=Invalid SSH private key::Terlihat seperti PUBLIC key (.pub), bukan private key."
            echo "Hint: gunakan isi file private key (contoh: ~/.ssh/haikal), bukan ~/.ssh/haikal.pub."
            exit 1
          fi

          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>/tmp/ssh-key-validate.err; then
            echo "::error title=Invalid SSH private key::$(tr '\n' ' ' < /tmp/ssh-key-validate.err)"
            echo "Hint: isi secret dengan PRIVATE key utuh (BEGIN..END), tanpa passphrase, dan bukan .pub."
            exit 1
          fi

      - name: Verify SSH connectivity
        run: |
          set -euo pipefail

          echo "Resolving ${DEPLOY_HOST}..."
          if ! getent hosts "${DEPLOY_HOST}" >/dev/null; then
            echo "::error title=DNS resolution failed::Cannot resolve ${DEPLOY_HOST} from GitHub runner."
            exit 1
          fi

          getent hosts "${DEPLOY_HOST}" | head -n 1

          echo "Checking TCP connectivity to ${DEPLOY_HOST}:${DEPLOY_PORT}..."
          if ! timeout 10 bash -c "cat < /dev/null > /dev/tcp/${DEPLOY_HOST}/${DEPLOY_PORT}" 2>/dev/null; then
            echo "::error title=SSH port unreachable::Cannot reach ${DEPLOY_HOST}:${DEPLOY_PORT} from GitHub runner."
            echo "Hint: pastikan firewall/server hosting mengizinkan koneksi SSH dari internet atau allowlist IP GitHub Actions."
            exit 1
          fi

          echo "SSH port is reachable."

      - name: Trust SSH host key
        run: |
          set -euo pipefail
          touch ~/.ssh/known_hosts

          if ! ssh-keyscan -T 10 -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/tmp/ssh-keyscan.err; then
            echo "::error title=ssh-keyscan failed::$(tr '\n' ' ' < /tmp/ssh-keyscan.err)"
            echo "Hint: cek DEPLOY_PORT, DNS host, firewall, dan pastikan service SSH aktif di server."
            exit 1
          fi

          chmod 644 ~/.ssh/known_hosts

      - name: Sync files to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${DEPLOY_PORT} -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "node_modules/" \
            --exclude "vendor/" \
            --exclude ".env" \
            --exclude "storage/logs/*" \
            --exclude "storage/framework/cache/*" \
            --exclude "storage/framework/sessions/*" \
            --exclude "storage/framework/views/*" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Run remote deploy commands
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${DEPLOY_PORT}" -o StrictHostKeyChecking=yes -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' APP_URL='${APP_URL}' DB_HOST='${DB_HOST}' DB_PORT='${DB_PORT}' DB_DATABASE='${DB_DATABASE}' DB_USERNAME='${DB_USERNAME}' DB_PASSWORD='${DB_PASSWORD}' bash -s" <<'EOSSH'
          set -euo pipefail

          cd "${DEPLOY_PATH}"

          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          set_env() {
            local key="$1"
            local value="$2"

            if grep -q "^${key}=" .env; then
              sed -i "s|^${key}=.*|${key}=${value}|" .env
            else
              echo "${key}=${value}" >> .env
            fi
          }

          set_env_if_present() {
            local key="$1"
            local value="$2"

            if [ -n "${value}" ]; then
              set_env "${key}" "${value}"
            fi
          }

          set_env APP_ENV production
          set_env APP_DEBUG false
          set_env APP_URL "${APP_URL}"
          if [ -n "${DB_HOST}" ] && [ -n "${DB_PORT}" ] && [ -n "${DB_DATABASE}" ] && [ -n "${DB_USERNAME}" ] && [ -n "${DB_PASSWORD}" ]; then
            set_env DB_CONNECTION mysql
          fi

          set_env_if_present DB_HOST "${DB_HOST}"
          set_env_if_present DB_PORT "${DB_PORT}"
          set_env_if_present DB_DATABASE "${DB_DATABASE}"
          set_env_if_present DB_USERNAME "${DB_USERNAME}"
          set_env_if_present DB_PASSWORD "${DB_PASSWORD}"

          if ! grep -q '^APP_KEY=base64:' .env; then
            php artisan key:generate --force
          fi

          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

          if command -v npm >/dev/null 2>&1; then
            npm ci
            npm run build
          fi

          php artisan migrate --force
          php artisan storage:link || true
          php artisan optimize:clear
          php artisan config:cache
          php artisan view:cache
          php artisan queue:restart || true

          chmod -R ug+rwx storage bootstrap/cache
          EOSSH
