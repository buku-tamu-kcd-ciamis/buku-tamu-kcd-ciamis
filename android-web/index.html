<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buku Tamu KCD</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #0b0f14;
      color: #f3f4f6;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 22px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 20px;
    }
    p {
      margin: 0;
      opacity: 0.9;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Buku Tamu KCD</h1>
    <p>Aplikasi Android sedang menyiapkan koneksi ke server.</p>
  </main>
</body>
</html>
