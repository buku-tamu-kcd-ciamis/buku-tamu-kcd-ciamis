<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Offline - Sistem Informasi Cadisdik XIII</title>
        <style>
            :root {
                color-scheme: light;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(160deg, #f0fdf4 0%, #f9fafb 100%);
                color: #14532d;
            }

            .offline-card {
                max-width: 420px;
                margin: 24px;
                padding: 28px;
                border-radius: 16px;
                background: #ffffff;
                box-shadow: 0 20px 50px rgba(20, 83, 45, 0.15);
                text-align: center;
            }

            .offline-card h1 {
                margin: 0 0 12px;
                font-size: 1.5rem;
            }

            .offline-card p {
                margin: 0;
                line-height: 1.6;
                color: #374151;
            }
        </style>
    </head>
    <body>
        <div class="offline-card">
            <h1>Anda sedang offline</h1>
            <p>
                Koneksi internet tidak tersedia. Silakan periksa jaringan Anda
                lalu muat ulang halaman.
            </p>
        </div>
    </body>
</html>
