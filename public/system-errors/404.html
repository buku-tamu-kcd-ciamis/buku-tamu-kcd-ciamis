<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>404 - Halaman Tidak Ditemukan</title>
    <link rel="stylesheet" href="/system-errors/error.css?v=20260401b">
</head>
<body>
    <main class="error-shell" role="main">
        <section class="error-card" aria-live="polite">
            <header class="error-header">
                <span class="error-app">
                    <img class="error-app-logo" src="/img/logo-cadisdik.png" alt="Logo Cadisdik">
                    <span class="error-app-title">Cabang Dinas Pendidikan Wilayah XIII</span>
                </span>
                <span class="error-badge">
                    <svg class="ui-icon ui-icon-stroke" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M12 8v5"></path>
                        <path d="M12 16h.01"></path>
                    </svg>
                    Status 404
                </span>
            </header>

            <h1 class="error-title">Halaman Tidak Ditemukan</h1>
            <p class="error-message">Halaman yang kamu cari tidak ada, dipindahkan, atau tautannya salah.</p>
            <p class="error-hint">Periksa URL atau kembali ke beranda untuk lanjut.</p>

            <div class="error-actions">
                <a class="btn btn-primary" href="/">
                    <svg class="ui-icon ui-icon-fill" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 3l9 8h-3v10H6V11H3l9-8z"></path>
                    </svg>
                    Kembali ke Beranda
                </a>
            </div>

            <p class="error-auto-back" id="autoBackText" aria-live="polite">
                <svg class="ui-icon ui-icon-stroke" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"></circle>
                    <path d="M12 7v5l3 2"></path>
                </svg>
                <span id="autoBackLabel"></span>
            </p>
            <footer class="error-footer">
                <span>
                    <svg class="ui-icon ui-icon-stroke" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M12 7v5l3 2"></path>
                    </svg>
                    <span id="timeBadge">Waktu sistem</span>
                </span>
                <span>
                    <svg class="ui-icon ui-icon-stroke" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 3l8 3v6c0 5-3.5 8.5-8 9-4.5-.5-8-4-8-9V6l8-3z"></path>
                    </svg>
                    Fallback statis aktif
                </span>
            </footer>
        </section>

        <footer class="site-footer">
            <a href="/tentang-developer" class="site-footer__link" title="Tentang Developer">
                Cadisdik Wilayah XIII &bull; &copy; <span id="yearValue"></span>
            </a>
        </footer>
    </main>

    <script>
        (function () {
            var timeBadge = document.getElementById('timeBadge');
            var yearValue = document.getElementById('yearValue');

            if (timeBadge) {
                var now = new Date();
                timeBadge.textContent = now.toLocaleString('id-ID', { hour12: false }) + ' WIB';
            }

            if (yearValue) {
                yearValue.textContent = String(new Date().getFullYear());
            }

            var autoBackLabel = document.getElementById('autoBackLabel');
            var countdownStorageKey = 'error404_deadline_' + window.location.pathname;
            var countdownSeconds = 30;
            var nowMs = Date.now();
            var defaultDeadline = nowMs + (countdownSeconds * 1000);
            var deadlineMs = defaultDeadline;

            try {
                var savedDeadline = Number(window.sessionStorage.getItem(countdownStorageKey));
                if (Number.isFinite(savedDeadline) && savedDeadline > nowMs) {
                    deadlineMs = savedDeadline;
                }
                window.sessionStorage.setItem(countdownStorageKey, String(deadlineMs));
            } catch (error) {
                // Ignore sessionStorage failures.
            }

            function navigateHome() {
                try {
                    window.sessionStorage.removeItem(countdownStorageKey);
                } catch (error) {
                    // Ignore sessionStorage failures.
                }
                window.location.href = '/';
            }

            function updateCountdownLabel() {
                if (!autoBackLabel) {
                    return;
                }

                var remainingSeconds = Math.max(0, Math.ceil((deadlineMs - Date.now()) / 1000));
                autoBackLabel.textContent = 'Otomatis kembali ke beranda dalam ' + remainingSeconds + ' detik.';

                if (remainingSeconds <= 0) {
                    window.clearInterval(intervalId);
                    navigateHome();
                }
            }

            updateCountdownLabel();

            var intervalId = window.setInterval(function () {
                updateCountdownLabel();
            }, 500);
        })();
    </script>
</body>
</html>
