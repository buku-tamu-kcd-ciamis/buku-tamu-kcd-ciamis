<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>4xx - Permintaan Tidak Dapat Diproses</title>
    <link rel="stylesheet" href="/system-errors/error.css?v=20260401b">
</head>
<body>
    <main class="error-shell" role="main">
        <section class="error-card" aria-live="polite">
            <header class="error-header">
                <span class="error-app">
                    <img class="error-app-logo" src="/img/logo-cadisdik.png" alt="Logo Cadisdik">
                    <span class="error-app-title">Cabang Dinas Pendidikan Wilayah XIII</span>
                </span>
                <span class="error-badge">
                    <svg class="ui-icon ui-icon-stroke" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M12 8v5"></path>
                        <path d="M12 16h.01"></path>
                    </svg>
                    Status 4xx
                </span>
            </header>

            <h1 class="error-title">Permintaan Tidak Dapat Diproses</h1>
            <p class="error-message">Permintaan dari sisi klien tidak dapat diproses oleh server.</p>
            <p class="error-hint">Periksa URL, data input, atau autentikasi yang digunakan.</p>

            <div class="error-actions">
                <a class="btn btn-primary" href="/">
                    <svg class="ui-icon ui-icon-fill" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 3l9 8h-3v10H6V11H3l9-8z"></path>
                    </svg>
                    Kembali ke Beranda
                </a>
            </div>


            <footer class="error-footer">
                <span>
                    <svg class="ui-icon ui-icon-stroke" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M12 7v5l3 2"></path>
                    </svg>
                    <span id="timeBadge">Waktu sistem</span>
                </span>
                <span>
                    <svg class="ui-icon ui-icon-stroke" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 3l8 3v6c0 5-3.5 8.5-8 9-4.5-.5-8-4-8-9V6l8-3z"></path>
                    </svg>
                    Fallback statis aktif
                </span>
            </footer>
        </section>

        <footer class="site-footer">
            <a href="/tentang-developer" class="site-footer__link" title="Tentang Developer">
                Cadisdik Wilayah XIII &bull; &copy; <span id="yearValue"></span>
            </a>
        </footer>
    </main>

    <script>
        (function () {
            var timeBadge = document.getElementById('timeBadge');
            var yearValue = document.getElementById('yearValue');

            if (timeBadge) {
                var now = new Date();
                timeBadge.textContent = now.toLocaleString('id-ID', { hour12: false }) + ' WIB';
            }

            if (yearValue) {
                yearValue.textContent = String(new Date().getFullYear());
            }


        })();
    </script>
</body>
</html>
